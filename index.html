<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Price Scanner & Cart</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 16px; background: #f4f6f8; color: #1a1a1a; max-width: 600px; margin-inline: auto; }
    h1 { font-size: 1.4rem; margin-top: 0; text-align: center; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    
    #scanner-container { position: relative; width: 100%; height: 240px; background: #000; border-radius: 8px; overflow: hidden; display: none; margin-top: 12px; }
    #scanner-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scan-line { position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: #ff3b30; box-shadow: 0 0 8px #ff3b30; z-index: 10; pointer-events: none; }

    button { background: #007aff; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
    button:active { opacity: 0.85; }
    button.secondary { background: #e5e5ea; color: #1a1a1a; }
    button.danger { background: #ff3b30; padding: 6px 10px; font-size: 0.85rem; width: auto; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .row { display: flex; gap: 8px; }

    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .cart-item:last-child { border-bottom: none; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; }
    .item-meta { font-size: 0.85rem; color: #666; }
    .total-bar { display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 700; padding-top: 12px; border-top: 2px solid #1a1a1a; margin-top: 12px; }
    .status { font-size: 0.85rem; color: #007aff; margin-top: 8px; text-align: center; min-height: 1.2em; }
    .warning-box { background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <h1>Barcode Scanner & Cart</h1>

  <div class="card">
    <button id="toggle-scan-btn">Start Camera Scanner</button>
    <div id="scanner-container">
      <video id="scanner-video" autoplay playsinline muted></video>
      <div class="scan-line"></div>
    </div>
    <div id="status-msg" class="status"></div>
    <div id="warning-msg" class="warning-box"></div>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Barcode / SKU</label>
      <input type="text" id="barcode-input" placeholder="Scan or type barcode...">
    </div>
    <div class="form-group">
      <label>Item Name</label>
      <input type="text" id="name-input" placeholder="Auto-filled on scan or type manually">
    </div>
    <div class="row">
      <div class="form-group" style="flex: 2;">
        <label>Price ($)</label>
        <input type="number" id="price-input" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Qty</label>
        <input type="number" id="qty-input" value="1" min="1">
      </div>
    </div>
    <button id="add-btn">Add to Cart</button>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h2 style="margin: 0; font-size: 1.1rem;">Your Cart</h2>
      <button id="clear-btn" class="secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;">Clear All</button>
    </div>
    <div id="cart-list">
      <p style="color: #888; text-align: center; font-size: 0.9rem;">Cart is empty. Scan an item to begin.</p>
    </div>
    <div class="total-bar">
      <span>Total:</span>
      <span id="cart-total">$0.00</span>
    </div>
  </div>

  <script>
    let isScanning = false;
    let videoStream = null;
    let scanInterval = null;
    let barcodeDetector = null;

    let cart = JSON.parse(localStorage.getItem('scanner_cart') || '[]');
    let priceMemory = JSON.parse(localStorage.getItem('price_memory') || '{}');

    const toggleBtn = document.getElementById('toggle-scan-btn');
    const scannerContainer = document.getElementById('scanner-container');
    const videoEl = document.getElementById('scanner-video');
    const statusMsg = document.getElementById('status-msg');
    const warningMsg = document.getElementById('warning-msg');
    const barcodeInput = document.getElementById('barcode-input');
    const nameInput = document.getElementById('name-input');
    const priceInput = document.getElementById('price-input');
    const qtyInput = document.getElementById('qty-input');

    toggleBtn.addEventListener('click', () => {
      if (isScanning) {
        stopScanner();
      } else {
        startScanner();
      }
    });

    async function startScanner() {
      warningMsg.style.display = 'none';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        warningMsg.style.display = 'block';
        warningMsg.textContent = 'Camera API blocked. Make sure you are opening this site via HTTPS (like GitHub Pages) and not as a local file.';
        return;
      }

      scannerContainer.style.display = 'block';
      toggleBtn.textContent = 'Stop Camera';
      toggleBtn.classList.add('secondary');
      statusMsg.textContent = 'Requesting camera access...';

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        videoEl.srcObject = videoStream;
        await videoEl.play();
        isScanning = true;

        if ('BarcodeDetector' in window) {
          barcodeDetector = new BarcodeDetector({
            formats: ['upc_a', 'upc_e', 'ean_13', 'ean_8', 'code_128', 'code_39', 'qr_code']
          });
          statusMsg.textContent = 'Point camera at a barcode...';
          scanInterval = setInterval(detectFrame, 400);
        } else {
          statusMsg.textContent = 'Camera active! (Auto-barcode reading not supported in this browser; type barcode below).';
        }
      } catch (err) {
        warningMsg.style.display = 'block';
        warningMsg.textContent = 'Camera error: ' + err.message + '. Check browser camera permissions and ensure you are on HTTPS.';
        stopScanner();
      }
    }

    function stopScanner() {
      isScanning = false;
      if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
      }
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      videoEl.srcObject = null;
      scannerContainer.style.display = 'none';
      toggleBtn.textContent = 'Start Camera Scanner';
      toggleBtn.classList.remove('secondary');
      statusMsg.textContent = '';
    }

    let lastScannedCode = '';
    let lastScanTime = 0;

    async function detectFrame() {
      if (!isScanning || !barcodeDetector || videoEl.readyState < 2) return;
      try {
        const barcodes = await barcodeDetector.detect(videoEl);
        if (barcodes.length > 0) {
          const code = barcodes[0].rawValue;
          if (code) {
            handleBarcodeDetected(code);
          }
        }
      } catch (e) {}
    }

    function handleBarcodeDetected(code) {
      const now = Date.now();
      if (code === lastScannedCode && now - lastScanTime < 2500) return;
      lastScannedCode = code;
      lastScanTime = now;

      playBeep();
      barcodeInput.value = code;

      if (priceMemory[code]) {
        nameInput.value = priceMemory[code].name;
        priceInput.value = priceMemory[code].price;
        statusMsg.textContent = 'Loaded saved item: ' + priceMemory[code].name;
      } else {
        nameInput.value = 'Item #' + code;
        statusMsg.textContent = 'Scanned ' + code + '! Enter name and price below.';
        priceInput.focus();
      }
    }

    document.getElementById('add-btn').addEventListener('click', () => {
      const code = barcodeInput.value.trim() || 'MANUAL-' + Date.now();
      const name = nameInput.value.trim() || 'Unnamed Item';
      const price = parseFloat(priceInput.value);
      const qty = parseInt(qtyInput.value, 10) || 1;

      if (isNaN(price) || price < 0) {
        alert('Please enter a valid price.');
        priceInput.focus();
        return;
      }

      priceMemory[code] = { name, price: price.toFixed(2) };
      localStorage.setItem('price_memory', JSON.stringify(priceMemory));

      const existing = cart.find(item => item.code === code && item.price === price);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ code, name, price, qty });
      }

      saveAndRenderCart();

      barcodeInput.value = '';
      nameInput.value = '';
      priceInput.value = '';
      qtyInput.value = 1;
      statusMsg.textContent = 'Added "' + name + '" to cart.';
    });

    function removeItem(index) {
      cart.splice(index, 1);
      saveAndRenderCart();
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('Clear all items from cart?')) {
        cart = [];
        saveAndRenderCart();
      }
    });

    function saveAndRenderCart() {
      localStorage.setItem('scanner_cart', JSON.stringify(cart));
      const cartList = document.getElementById('cart-list');
      const totalEl = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartList.innerHTML = '<p style="color: #888; text-align: center; font-size: 0.9rem;">Cart is empty. Scan an item to begin.</p>';
        totalEl.textContent = '$0.00';
        return;
      }

      let total = 0;
      cartList.innerHTML = cart.map((item, idx) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        return `
          <div class="cart-item">
            <div class="item-info">
              <div class="item-name">${escapeHtml(item.name)}</div>
              <div class="item-meta">$${item.price.toFixed(2)} &times; ${item.qty} = <strong>$${subtotal.toFixed(2)}</strong></div>
            </div>
            <button class="danger" onclick="removeItem(${idx})">X</button>
          </div>
        `;
      }).join('');

      totalEl.textContent = '$' + total.toFixed(2);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    saveAndRenderCart();
  </script>
</body>
</html>
